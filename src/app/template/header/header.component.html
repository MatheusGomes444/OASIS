<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<!-- FAIXA SUPERIOR -->
<header class="header-oasis">
  <div class="header-left">
    <button class="btn nav-icon-btn menu-toggle-btn" (click)="toggleSidebar()" type="button" title="Menu">
      <i class="material-icons">menu</i>
    </button>
    <a class="navbar-brand m-0 d-flex align-items-center" href="#">
      <h1 class="logo-text">OÁSIS</h1>
    </a>
  </div>

  <div class="header-right">
    <button class="btn nav-icon-btn profile-btn" type="button" title="Perfil">
      <i class="material-icons">person</i>
    </button>
    <button class="btn nav-icon-btn logout-btn" type="button" title="Sair">
      <i class="material-icons">logout</i>
    </button>
  </div>
</header>

<!-- MENU LATERAL (SIDEBAR VERDE) -->
<aside class="sidebar-oasis" [class.open]="isSidebarOpen">
  <nav class="sidebar-nav">
    <a class="sidebar-item" routerLink="/albergue" routerLinkActive="active" (click)="autoCloseOnMobile()">
      <i class="material-icons sidebar-icon">home</i>
      <span>Meu Albergue</span>
    </a>
    
    <a class="sidebar-item" routerLink="/moradores" routerLinkActive="active" (click)="autoCloseOnMobile()">
      <i class="material-icons sidebar-icon">people</i>
      <span>Moradores</span>
    </a>
    
    <a class="sidebar-item" routerLink="/alojamentos" routerLinkActive="active" (click)="autoCloseOnMobile()">
      <i class="material-icons sidebar-icon">hotel</i>
      <span>Alojamentos</span>
    </a>

    <div class="sidebar-divider"></div>

    <a class="sidebar-item highlight-item" routerLink="/cadastrarmoradores" routerLinkActive="active" (click)="autoCloseOnMobile()">
      <i class="material-icons sidebar-icon">person_add</i>
      <span>Cadastrar Moradores</span>
    </a>
  </nav>
</aside>
